spring.application.name=actividad3
server.port=8080

# Configuración de la base de datos MySQL LOCAL
spring.datasource.url=jdbc:mysql://localhost:3306/nextvoto_local_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA 
# "update" crea las tablas si no existen y las actualiza si modificas las entidades
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect